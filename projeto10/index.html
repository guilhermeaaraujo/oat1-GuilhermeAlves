<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mini Design System</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main>
        <section class="paleta">
            <h1>Paleta de Cores</h1>
            <div class="cores">
                <div class="quadrado" id="cor50"><label for="cor50">Cor 50</label></div>

                <div class="quadrado" id="cor100"><label for="cor100">Cor 100</label></div>
                
                <div class="quadrado" id="cor300"><label for="cor300">Cor 300</label></div>

                <div class="quadrado" id="cor600"><label for="cor600">Cor 600</label></div>
                
                <div class="quadrado" id="cor900"><label for="cor900">Cor 900</label></div>
                
            </div>
        </section>
        <section class="escalaEBotoes">
            <div class="escala">
                <h1>Escala Tipográfica</h1>
                <div class="texto" id="grande">
                    <p>Texto Grande</p>
                </div>
                <div class="texto" id="medio">
                    <p>Texto Médio</p>
                </div>
                <div class="texto" id="pequeno">
                    <p>Texto Pequeno</p>
                </div>
                <div class="texto" id="legenda">
                    <p>Legenda</p>
                </div>
            </div>
            <div class="botoes">
                <h1>Botões</h1>
                    <div class="osbotoes"></div>
                        <div id="primary">
                            <h2>Primary</h2>
                            <div class="meusbotoes">
                                <button class="normal">Normal</button>
                                <button class="hover">Hover</button>
                                <button class="focus">Focus</button>
                                <button class="disabled">Disabled</button>
                            </div>
                        </div>

                        <div id="secondary">
                            <h2>Secondary</h2>
                            <div class="meusbotoes">
                                <button class="normal">Normal</button>
                                <button class="hover">Hover</button>
                                <button class="focus">Focus</button>
                                <button class="disabled">Disabled</button>
                            </div>
                        </div>

                        <div id="ghost">
                            <h2>Ghost</h2>
                            <div class="meusbotoes">
                                <button class="normal">Normal</button>
                                <button class="hover">Hover</button>
                                <button class="focus">Focus</button>
                                <button class="disabled">Disabled</button>
                            </div>
                        </div>
                    </div>
            </div>
        </section>
    </main>
</body>
</html>
