<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Card de Produto</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main>
        <div class="div-imagen">
            <img src="ps5.jpg" alt="Playstation 5">
            <span><b>OFERTA</b></span>
        </div>

        <h2>Playstation 5</h2>

        <p class="precocortado"><b>R$ 4.999,99</b></p>
        <p><b>R$ 4.500,99</b></p>

        <div class="center">
            <button class="conteudo"><b>COMPRAR AGORA</b></button>
        </div>
    </main>
</body>
</html>
